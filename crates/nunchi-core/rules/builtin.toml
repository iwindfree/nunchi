# ASP.NET `[Route("api/[controller]")]`
[[base_path]]
lang = "csharp"
annotation = "Route"

[[bean]]
lang = "csharp"
annotations = [
    "ApiController",
    "Controller",
]

[[bean]]
lang = "java"
annotations = [
    "RestController",
    "Controller",
    "Service",
    "Repository",
    "Component",
    "Configuration",
]

[[inject]]
lang = "java"
annotations = [
    "Autowired",
    "Inject",
]
final_fields = true
constructor_params = true

[[http_client]]
lang = "typescript"
callee = "fetch"
receiver_methods = []
method = "GET"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "typescript"
receiver_methods = [
    "get",
    "post",
    "put",
    "delete",
    "patch",
    "head",
    "options",
]
url_arg = 0
exclude_receivers = [
    "this",
    "app",
    "router",
    "server",
    "mock",
]

# requests · httpx · aiohttp — 파이썬 HTTP 클라이언트
# app·router는 라우트 정의다. cache·redis는 HTTP가 아니다. session은
# `session.get(url)`이 실제 클라이언트 호출이므로 제외하지 않는다.
[[http_client]]
lang = "python"
receiver_methods = [
    "get",
    "post",
    "put",
    "delete",
    "patch",
]
url_arg = 0
exclude_receivers = [
    "app",
    "router",
    "blueprint",
    "bp",
    "cache",
    "redis",
]

# Spring RestTemplate — 백엔드가 다른 서비스를 부르는 경로다.
# 메서드 이름에 HTTP 동사가 드러나는 것만 넣는다. `put`은 `Map.put`이,
# `get`은 `List.get`이 같은 이름이라 오탐이 커서 제외한다.
# RestTemplate의 `put`·`exchange`가 필요하면 설정 파일에 추가하면 된다.
[[http_client]]
lang = "java"
receiver_methods = [
    "getForObject",
    "getForEntity",
]
method = "GET"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = [
    "postForObject",
    "postForEntity",
    "postForLocation",
]
method = "POST"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = ["patchForObject"]
method = "PATCH"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = ["delete"]
method = "DELETE"
url_arg = 0
# 자체 DAO의 `delete(경로문자열)`은 URL 판별에서도 걸러지지만 여기서 먼저 막는다.
exclude_receivers = [
    "repository",
    "repo",
    "dao",
    "mapper",
]

# C# HttpClient
[[http_client]]
lang = "csharp"
receiver_methods = [
    "GetAsync",
    "PostAsync",
    "PutAsync",
    "DeleteAsync",
    "PatchAsync",
]
url_arg = 0
exclude_receivers = []

# JPA와 MyBatis 어노테이션 매퍼 — MyBatis는 한국 기업 Spring 환경에서
# 비중이 크므로 함께 다룬다.
[[persistence]]
lang = "java"
entity_annotations = ["Entity"]
table_annotations = ["Table"]
sql_annotations = [
    "Select",
    "Insert",
    "Update",
    "Delete",
    "SelectProvider",
]
repository_supertypes = [
    "JpaRepository",
    "CrudRepository",
    "MongoRepository",
]

# SQLAlchemy
[[persistence]]
lang = "python"
entity_annotations = []
table_annotations = []
sql_annotations = []
table_attribute = "__tablename__"
repository_supertypes = []

