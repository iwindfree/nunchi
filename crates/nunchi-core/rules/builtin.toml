# nunchi 내장 프레임워크 규칙
#
# 이 파일이 기본값이다. `include_str!`로 컴파일 시점에 바이너리에 들어가므로
# 배포물은 여전히 실행 파일 하나다. tree-sitter 쿼리를 `queries/*.scm`에 둔
# 것과 같은 방식이다.
#
# 규칙을 추가하려면 이 파일에 항목을 넣고 `cargo test`를 실행한다. Rust 코드를
# 고칠 필요가 없다. 각 필드가 무엇을 뜻하는지는 `crates/nunchi-core/src/rules.rs`의
# 구조체 주석에 적혀 있다.
#
# 사용자는 이 파일을 고치지 않는다. `nunchi.shared.toml`의 `[framework]` 절에
# 적은 규칙이 여기 정의된 기본값 뒤에 덧붙는다.

[[route]]
lang = "java"
annotation = "GetMapping"
method = "GET"
receivers = []

[[route]]
lang = "java"
annotation = "PostMapping"
method = "POST"
receivers = []

[[route]]
lang = "java"
annotation = "PutMapping"
method = "PUT"
receivers = []

[[route]]
lang = "java"
annotation = "DeleteMapping"
method = "DELETE"
receivers = []

[[route]]
lang = "java"
annotation = "PatchMapping"
method = "PATCH"
receivers = []

[[route]]
lang = "java"
annotation = "RequestMapping"
method = "ANY"
method_from_args_prefix = "RequestMethod."
receivers = []

# FastAPI `@app.get("/x")` · Flask `@app.route("/x", methods=["POST"])`
# 파이썬 데코레이터는 수신자가 붙으므로, `receivers`로 `@cache.get` 오탐을 막는다.
[[route]]
lang = "python"
annotation = "get"
method = "GET"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "post"
method = "POST"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "put"
method = "PUT"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "delete"
method = "DELETE"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "patch"
method = "PATCH"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

# Flask는 `methods=["POST"]`로 HTTP 메서드를 지정한다.
[[route]]
lang = "python"
annotation = "route"
method = "ANY"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]
method_from_args_list = "methods"

