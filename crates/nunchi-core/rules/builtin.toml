# Built-in framework rules for nunchi.
#
# These are the defaults. The file is embedded at compile time via `include_str!`,
# so the artifact is still a single executable. Same approach as the tree-sitter
# queries in `queries/*.scm`.
#
# To add a rule, append an entry here and run `cargo test`. No Rust code needs to
# change. See the struct doc comments in `crates/nunchi-core/src/rules.rs` for what
# each field means.
#
# End users do not edit this file. Rules under `[framework]` in `nunchi.shared.toml`
# are appended after these defaults.

[[route]]
lang = "java"
annotation = "GetMapping"
method = "GET"
receivers = []

[[route]]
lang = "java"
annotation = "PostMapping"
method = "POST"
receivers = []

[[route]]
lang = "java"
annotation = "PutMapping"
method = "PUT"
receivers = []

[[route]]
lang = "java"
annotation = "DeleteMapping"
method = "DELETE"
receivers = []

[[route]]
lang = "java"
annotation = "PatchMapping"
method = "PATCH"
receivers = []

[[route]]
lang = "java"
annotation = "RequestMapping"
method = "ANY"
method_from_args_prefix = "RequestMethod."
receivers = []

# FastAPI `@app.get("/x")` and Flask `@app.route("/x", methods=["POST"])`.
# Python decorators carry a receiver, so `receivers` keeps `@cache.get` from
# being mistaken for a route.
[[route]]
lang = "python"
annotation = "get"
method = "GET"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "post"
method = "POST"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "put"
method = "PUT"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "delete"
method = "DELETE"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

[[route]]
lang = "python"
annotation = "patch"
method = "PATCH"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]

# Flask names the HTTP method in `methods=["POST"]`.
[[route]]
lang = "python"
annotation = "route"
method = "ANY"
receivers = [
    "app",
    "router",
    "api",
    "blueprint",
    "bp",
]
method_from_args_list = "methods"

# ASP.NET `[HttpGet("orders")]`.
[[route]]
lang = "csharp"
annotation = "HttpGet"
method = "GET"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpPost"
method = "POST"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpPut"
method = "PUT"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpDelete"
method = "DELETE"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpPatch"
method = "PATCH"
receivers = []

[[base_path]]
lang = "java"
annotation = "RequestMapping"

# ASP.NET `[Route("api/[controller]")]`.
[[base_path]]
lang = "csharp"
annotation = "Route"

[[bean]]
lang = "csharp"
annotations = [
    "ApiController",
    "Controller",
]

[[bean]]
lang = "java"
annotations = [
    "RestController",
    "Controller",
    "Service",
    "Repository",
    "Component",
    "Configuration",
]

[[inject]]
lang = "java"
annotations = [
    "Autowired",
    "Inject",
]
final_fields = true
constructor_params = true

[[http_client]]
lang = "typescript"
callee = "fetch"
receiver_methods = []
method = "GET"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "typescript"
receiver_methods = [
    "get",
    "post",
    "put",
    "delete",
    "patch",
    "head",
    "options",
]
url_arg = 0
exclude_receivers = [
    "this",
    "app",
    "router",
    "server",
    "mock",
]

# Python HTTP clients: requests, httpx, aiohttp.
# `app` and `router` define routes rather than call them. `cache` and `redis` are
# usually not HTTP; `session` is kept because `session.get(url)` is a real call.
[[http_client]]
lang = "python"
receiver_methods = [
    "get",
    "post",
    "put",
    "delete",
    "patch",
]
url_arg = 0
exclude_receivers = [
    "app",
    "router",
    "blueprint",
    "bp",
    "cache",
    "redis",
]

# Spring RestTemplate — how a backend calls another service.
# Only methods whose name states the HTTP verb are listed. `put` collides with
# `Map.put` and `get` with `List.get`, so both are left out to avoid false
# positives. Add RestTemplate's `put` or `exchange` in your config if you need them.
[[http_client]]
lang = "java"
receiver_methods = [
    "getForObject",
    "getForEntity",
]
method = "GET"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = [
    "postForObject",
    "postForEntity",
    "postForLocation",
]
method = "POST"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = ["patchForObject"]
method = "PATCH"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = ["delete"]
method = "DELETE"
url_arg = 0
# A custom DAO `delete(pathString)` would also fail the URL check, but excluding
# these receivers rejects it earlier.
exclude_receivers = [
    "repository",
    "repo",
    "dao",
    "mapper",
]

# C# HttpClient.
[[http_client]]
lang = "csharp"
receiver_methods = [
    "GetAsync",
    "PostAsync",
    "PutAsync",
    "DeleteAsync",
    "PatchAsync",
]
url_arg = 0
exclude_receivers = []

# JPA plus MyBatis annotation mappers. MyBatis is widely used in Korean
# enterprise Spring codebases, which this tool targets.
[[persistence]]
lang = "java"
entity_annotations = ["Entity"]
table_annotations = ["Table"]
sql_annotations = [
    "Select",
    "Insert",
    "Update",
    "Delete",
    "SelectProvider",
]
repository_supertypes = [
    "JpaRepository",
    "CrudRepository",
    "MongoRepository",
]

# SQLAlchemy.
[[persistence]]
lang = "python"
entity_annotations = []
table_annotations = []
sql_annotations = []
table_attribute = "__tablename__"
repository_supertypes = []

