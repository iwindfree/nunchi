# 언어별 구문 트리 노드 이름
#
# 여기 적힌 이름은 **tree-sitter 문법 크레이트가 정한 것**이다. 언어 명세가
# 아니라 각 크레이트의 `grammar.js`에 적힌 규칙 이름이며, 파서가 만드는 노드에
# 그대로 붙는다.
#
# 같은 뜻인데 이름이 다른 이유는 문법을 언어마다 다른 사람이 만들었고 각자
# 자기 언어 명세의 용어를 따라갔기 때문이다. Java 명세는 `MethodInvocation`,
# ECMAScript 명세는 `CallExpression`, C# 명세는 `invocation_expression`,
# Python 문법 참조는 `call`을 쓴다. 다만 최종 권위는 명세가 아니라
# `grammar.js`이므로 문법 작성자가 다르게 정하면 이름도 달라진다.
#
# ── 문법 크레이트를 올릴 때 ────────────────────────────────────────
#
# 이 파일은 크레이트 버전에 종속된다. 전부 1.0 이전이라 규칙 이름이 바뀔 수
# 있고, 바뀌면 탐지가 오류 없이 조용히 멈춘다. 버전을 올린 뒤에는 반드시
# `cargo test`를 돌린다. `detects_api_calls_in_every_supported_language`가
# 네 언어를 실제로 파싱해 보므로 이름이 달라지면 그 자리에서 실패한다.
#
# 이름만이 아니라 구조도 다르다. TypeScript는 `function` 필드 아래에 수신자와
# 메서드가 있는데 Java는 호출식 자체가 `object`와 `name`을 직접 갖는다.
# C#은 실인자가 `argument` 노드로 한 겹 더 감싸여 있다.
#
# 이 차이를 놓치면 오류 없이 결과만 빈다. 실제로 Python과 C#의 HTTP 클라이언트
# 규칙이 등록되어 있는데도 한 건도 탐지되지 않은 적이 있다.
#
# 노드 이름을 알아내려면 해당 문법 크레이트의 `grammar.js`를 읽거나, 짧은
# 코드를 파싱해서 트리를 출력해 보면 된다.
#
# ── 규칙 파일 구성 ─────────────────────────────────────────────────
#
#   builtin.syntax.toml       이 파일. 언어 문법에 종속된 노드 이름
#   builtin.java.toml         Java — Spring, JPA, MyBatis
#   builtin.python.toml       Python — FastAPI, Flask, SQLAlchemy
#   builtin.typescript.toml   TypeScript · JavaScript
#   builtin.csharp.toml       C# — ASP.NET, HttpClient
#
# 전부 `include_str!`로 컴파일 시점에 바이너리에 들어가므로 배포물은 여전히
# 실행 파일 하나다. 언어를 추가할 때는 이 파일에 `[[lang_syntax]]`를 넣고
# `builtin.<언어>.toml`을 새로 만든다.

# ── TypeScript · JavaScript ────────────────────────────────────────
# JavaScript는 TypeScript 파서로 읽으므로 문법이 같다.
[[lang_syntax]]
lang = "typescript"
call = ["call_expression"]
member = ["member_expression"]
receiver_field = "object"
method_field = "property"
string = ["string", "template_string"]
lambda = [
    "arrow_function",
    "function_expression",
    "function",
    "function_declaration",
]
concat = ["binary_expression"]
qualified_name = ["member_expression"]
declaration = ["variable_declarator"]
declaration_name_field = "name"
declaration_value_field = "value"
member_is_call = false

[[lang_syntax]]
lang = "javascript"
call = ["call_expression"]
member = ["member_expression"]
receiver_field = "object"
method_field = "property"
string = ["string", "template_string"]
lambda = [
    "arrow_function",
    "function_expression",
    "function",
    "function_declaration",
]
concat = ["binary_expression"]
qualified_name = ["member_expression"]
declaration = ["variable_declarator"]
declaration_name_field = "name"
declaration_value_field = "value"
member_is_call = false

# ── Python ────────────────────────────────────────────────────────
# f-문자열도 `string` 노드다. 접두 `f`는 값을 읽을 때 벗긴다.
[[lang_syntax]]
lang = "python"
call = ["call"]
member = ["attribute"]
receiver_field = "object"
method_field = "attribute"
string = ["string", "concatenated_string"]
lambda = ["lambda"]
concat = ["binary_operator"]
qualified_name = ["attribute"]
declaration = ["assignment"]
declaration_name_field = "left"
declaration_value_field = "right"
member_is_call = false

# ── Java ──────────────────────────────────────────────────────────
# `method_invocation`이 `object`와 `name` 필드를 직접 갖는다. 그래서 수신자와
# 메서드를 담은 별도 노드가 없고 `member_is_call`이 참이다.
[[lang_syntax]]
lang = "java"
call = ["method_invocation"]
member = ["method_invocation"]
receiver_field = "object"
method_field = "name"
string = ["string_literal"]
lambda = ["lambda_expression"]
concat = ["binary_expression"]
qualified_name = ["field_access"]
declaration = ["variable_declarator"]
declaration_name_field = "name"
declaration_value_field = "value"
member_is_call = true

# ── C# ────────────────────────────────────────────────────────────
# 실인자가 `argument` 노드로 한 겹 감싸여 있어 `arg_wrapper`가 필요하다.
# 보간 문자열 `$"..."`과 축자 문자열 `@"..."`도 함께 읽는다.
[[lang_syntax]]
lang = "csharp"
call = ["invocation_expression"]
member = ["member_access_expression"]
receiver_field = "expression"
method_field = "name"
string = [
    "string_literal",
    "verbatim_string_literal",
    "interpolated_string_expression",
    "raw_string_literal",
]
lambda = ["lambda_expression", "anonymous_method_expression"]
arg_wrapper = "argument"
concat = ["binary_expression"]
qualified_name = ["member_access_expression"]
declaration = ["variable_declarator"]
declaration_name_field = "name"
declaration_value_field = "value"
member_is_call = false
