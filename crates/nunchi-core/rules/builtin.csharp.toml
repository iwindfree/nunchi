# C# — ASP.NET, HttpClient
#
# WinForms 쪽은 라우트가 없고 심볼 추출만 동작한다.
#
# 이 파일은 `builtin.<언어>.toml` 묶음의 하나다. 전체 구성은
# `builtin.syntax.toml`의 머리말에 적어 두었다.

# ASP.NET `[HttpGet("orders")]`
[[route]]
lang = "csharp"
annotation = "HttpGet"
method = "GET"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpPost"
method = "POST"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpPut"
method = "PUT"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpDelete"
method = "DELETE"
receivers = []

[[route]]
lang = "csharp"
annotation = "HttpPatch"
method = "PATCH"
receivers = []



# ASP.NET `[Route("api/[controller]")]`
[[base_path]]
lang = "csharp"
annotation = "Route"



[[bean]]
lang = "csharp"
annotations = [
    "ApiController",
    "Controller",
]



# 자체 DAO의 `delete(경로문자열)`은 URL 판별에서도 걸러지지만 여기서 먼저 막는다.
exclude_receivers = [
    "repository",
    "repo",
    "dao",
    "mapper",
]

# C# HttpClient
# 동사마다 규칙을 나눈 이유가 있다. 메서드 이름에서 `Async` 만 벗기는
# 방식으로는 `PostAsJsonAsync` 가 `POSTASJSON` 이 된다. 확장 메서드가
# 흔하므로 이름을 그대로 적어 두는 편이 안전하다.
[[http_client]]
lang = "csharp"
receiver_methods = [
    "GetAsync",
    "GetStringAsync",
    "GetByteArrayAsync",
    "GetStreamAsync",
    "GetFromJsonAsync",
]
method = "GET"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "csharp"
receiver_methods = [
    "PostAsync",
    "PostAsJsonAsync",
]
method = "POST"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "csharp"
receiver_methods = [
    "PutAsync",
    "PutAsJsonAsync",
]
method = "PUT"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "csharp"
receiver_methods = [
    "DeleteAsync",
    "DeleteFromJsonAsync",
]
method = "DELETE"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "csharp"
receiver_methods = [
    "PatchAsync",
    "PatchAsJsonAsync",
]
method = "PATCH"
url_arg = 0
exclude_receivers = []
