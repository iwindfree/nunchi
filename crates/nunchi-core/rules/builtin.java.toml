# Java — Spring, JPA, MyBatis
#
# Spring Boot 백엔드가 주 대상이다. MyBatis는 한국 기업 환경에서
# 비중이 커서 JPA와 함께 다룬다.
#
# 이 파일은 `builtin.<언어>.toml` 묶음의 하나다. 전체 구성은
# `builtin.syntax.toml`의 머리말에 적어 두었다.

[[route]]
lang = "java"
annotation = "GetMapping"
method = "GET"
receivers = []

[[route]]
lang = "java"
annotation = "PostMapping"
method = "POST"
receivers = []

[[route]]
lang = "java"
annotation = "PutMapping"
method = "PUT"
receivers = []

[[route]]
lang = "java"
annotation = "DeleteMapping"
method = "DELETE"
receivers = []

[[route]]
lang = "java"
annotation = "PatchMapping"
method = "PATCH"
receivers = []

[[route]]
lang = "java"
annotation = "RequestMapping"
method = "ANY"
method_from_args_prefix = "RequestMethod."
receivers = []



[[base_path]]
lang = "java"
annotation = "RequestMapping"



[[bean]]
lang = "java"
annotations = [
    "RestController",
    "Controller",
    "Service",
    "Repository",
    "Component",
    "Configuration",
]



[[inject]]
lang = "java"
annotations = [
    "Autowired",
    "Inject",
]
final_fields = true
constructor_params = true



# Spring RestTemplate — 백엔드가 다른 서비스를 부르는 경로다.
# 메서드 이름에 HTTP 동사가 드러나는 것만 넣는다. `put`은 `Map.put`이,
# `get`은 `List.get`이 같은 이름이라 오탐이 커서 제외한다.
# RestTemplate의 `put`·`exchange`가 필요하면 설정 파일에 추가하면 된다.
[[http_client]]
lang = "java"
receiver_methods = [
    "getForObject",
    "getForEntity",
]
method = "GET"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = [
    "postForObject",
    "postForEntity",
    "postForLocation",
]
method = "POST"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = ["patchForObject"]
method = "PATCH"
url_arg = 0
exclude_receivers = []

[[http_client]]
lang = "java"
receiver_methods = ["delete"]
method = "DELETE"
url_arg = 0

# `rest.exchange(url, HttpMethod.POST, entity, X.class)` — RestTemplate 에서
# 본문이나 헤더를 실어 보낼 때 쓰는 형태다. 메서드가 인자로 오므로
# `method_arg` 로 읽는다. 그 자리를 읽지 못하면 호출을 버린다. 메서드를
# 모르면 어느 라우트에 이어야 할지 정할 수 없기 때문이다.
[[http_client]]
lang = "java"
receiver_methods = [
    "exchange",
    "execute",
]
method_arg = 1
url_arg = 0
exclude_receivers = []

# `webClient.get().uri("/api/orders").retrieve()` — Spring 5 부터 RestTemplate
# 을 대신하는 형태다. HTTP 메서드가 `uri` 앞의 호출에 있으므로 수신자를
# 한 겹 더 들여다본다. `builder.uri(...)` 같은 것을 잡지 않도록,
# 수신자가 여기 적힌 이름으로 부른 호출일 때만 인정한다.
[[http_client]]
lang = "java"
receiver_methods = ["uri"]
method_from_receiver = [
    "get",
    "post",
    "put",
    "delete",
    "patch",
    "head",
    "options",
]
url_arg = 0
exclude_receivers = []



# JPA와 MyBatis 어노테이션 매퍼 — MyBatis는 한국 기업 Spring 환경에서
# 비중이 크므로 함께 다룬다.
[[persistence]]
lang = "java"
entity_annotations = ["Entity"]
table_annotations = ["Table"]
sql_annotations = [
    "Select",
    "Insert",
    "Update",
    "Delete",
    "SelectProvider",
]
repository_supertypes = [
    "JpaRepository",
    "CrudRepository",
    "MongoRepository",
]
